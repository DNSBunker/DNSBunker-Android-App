version: 2
updates:
  # Android Gradle plugin, Kotlin, AndroidX/Compose and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # Go modules of the native QUIC and network stack library.
  - package-ecosystem: gomod
    directory: /native/quic
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # Actions used by the workflows, including CodeQL.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: [ "*" ]
